name: Update signatures

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signatures:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify update authentication and the publishing tool
        run: scripts/test/update-auth.sh
